name: Build installable packages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run package:web
      - run: npx cap add android
      - name: Enable Firebase and Google sign-in
        run: |
          cp google-services.json android/app/google-services.json
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          grep -q 'rgcfaIncludeGoogle = true' android/variables.gradle
      - run: npx cap sync android
      - name: Assemble release APK
        run: ./gradlew assembleRelease
        working-directory: android
      - name: Sign with the Timing release key
        # Google sign-in only works when the APK is signed with the key whose SHA-1 is registered in Firebase.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::Add the ANDROID_KEYSTORE_* secrets in GitHub (Settings → Secrets and variables → Actions)."; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/timing.jks"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          "$BUILD_TOOLS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/timing.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out dist/Timing-android.apk "$RUNNER_TEMP/aligned.apk"
          rm "$RUNNER_TEMP/timing.jks"
          SIGNED=$("$BUILD_TOOLS/apksigner" verify --print-certs dist/Timing-android.apk | sed -n 's/.*certificate SHA-1 digest: //p' | head -1)
          REGISTERED=$(node -e "console.log(require('./google-services.json').client[0].oauth_client.find(c => c.android_info).android_info.certificate_hash)")
          echo "APK signed with SHA-1 $SIGNED (Firebase has $REGISTERED)"
          if [ "$SIGNED" != "$REGISTERED" ]; then echo "::error::The signing key does not match the SHA-1 registered in Firebase, so Google sign-in would fail."; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-Android-APK
          path: dist/Timing-android.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run package:web
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Compile without signing
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app dist/Payload/Timing.app
          cd dist
          zip -qr Timing-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-iOS-unsigned-IPA
          path: dist/Timing-unsigned.ipa
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error

  linux:
    name: Ubuntu DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-Ubuntu-DEB
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish direct package downloads
    needs: [android, ios, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Timing-*
          merge-multiple: true
          path: release-assets
      - name: Check every package exists
        shell: bash
        run: |
          for extension in apk ipa exe deb; do
            compgen -G "release-assets/*.${extension}" > /dev/null || exit 1
          done
      - name: Publish prerelease with individual files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" release-assets/*.apk release-assets/*.ipa release-assets/*.exe release-assets/*.deb \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Timing build ${GITHUB_RUN_NUMBER}" --prerelease \
            --notes "Android APK (release-signed, with Google sign-in), Windows portable EXE, Ubuntu DEB, and unsigned iOS IPA. The IPA requires Apple signing before device installation."
