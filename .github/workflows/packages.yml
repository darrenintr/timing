name: Build installable packages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package:web
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
      - run: npx cap add android
      - run: python3 scripts/configure-native.py android
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
          TIMING_FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.TIMING_FIREBASE_ANDROID_JSON_BASE64 }}
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run package:web
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
      - run: npx cap add ios
      - run: python3 scripts/configure-native.py ios
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
          TIMING_FIREBASE_IOS_PLIST_BASE64: ${{ secrets.TIMING_FIREBASE_IOS_PLIST_BASE64 }}
      - run: rm Podfile.lock && pod install
        working-directory: ios/App
      - name: Compile without signing
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app dist/Payload/Timing.app
          cd dist
          zip -qr Timing-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-iOS-unsigned-IPA
          path: dist/Timing-unsigned.ipa
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package:windows
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error

  linux:
    name: Ubuntu DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package:linux
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-Ubuntu-DEB
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish direct package downloads
    needs: [android, ios, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Timing-*
          merge-multiple: true
          path: release-assets
      - name: Check every package exists
        shell: bash
        run: |
          for extension in apk ipa exe deb; do
            compgen -G "release-assets/*.${extension}" > /dev/null || exit 1
          done
      - name: Publish prerelease with individual files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" release-assets/*.apk release-assets/*.ipa release-assets/*.exe release-assets/*.deb \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Timing build ${GITHUB_RUN_NUMBER}" --prerelease \
            --notes "Android debug APK, Windows portable EXE, Ubuntu DEB, and unsigned iOS IPA. The IPA requires Apple signing before device installation."
