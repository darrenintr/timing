name: Build installable packages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package:web
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
      - run: python3 scripts/configure-native.py prepare-android
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
          TIMING_FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.TIMING_FIREBASE_ANDROID_JSON_BASE64 }}
      - run: npx cap add android
      - run: python3 scripts/configure-native.py android
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
          TIMING_FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.TIMING_FIREBASE_ANDROID_JSON_BASE64 }}
      - run: python3 scripts/install-android-widget.py
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
        working-directory: android
      - name: Package Android APK
        # A stable release key is needed for Android Google sign-in across CI builds.
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/Timing-android.apk
            echo 'No persistent release key supplied; publishing debug APK.'
            exit 0
          fi
          (cd android && ./gradlew assembleRelease)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/timing.jks"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/timing.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out dist/Timing-android.apk "$RUNNER_TEMP/aligned.apk"
          rm "$RUNNER_TEMP/timing.jks"
          SIGNED=$("$BUILD_TOOLS/apksigner" verify --print-certs dist/Timing-android.apk | sed -n 's/.*certificate SHA-1 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          if [ -n "$TIMING_FIREBASE_CONFIG" ]; then
            REGISTERED=$(node -e "console.log(require('./android/app/google-services.json').client[0].oauth_client.find(c => c.android_info).android_info.certificate_hash.toLowerCase())")
            echo "APK signed with SHA-1 $SIGNED (Firebase has $REGISTERED)"
            if [ "$SIGNED" != "$REGISTERED" ]; then echo "::error::The signing key does not match the SHA-1 registered in Firebase, so Google sign-in would fail."; exit 1; fi
          else
            echo 'APK release-signed; Google sync remains disabled until Firebase configuration is supplied.'
          fi
      - name: Verify widget is registered in APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump xmltree dist/Timing-android.apk AndroidManifest.xml | grep -q 'TimingWidgetProvider'
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-Android-APK
          path: dist/Timing-android.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run package:web
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
      - run: python3 scripts/configure-native.py prepare-ios
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
          TIMING_FIREBASE_IOS_PLIST_BASE64: ${{ secrets.TIMING_FIREBASE_IOS_PLIST_BASE64 }}
      - run: npx cap add ios
      - run: python3 scripts/configure-native.py ios
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
          TIMING_FIREBASE_IOS_PLIST_BASE64: ${{ secrets.TIMING_FIREBASE_IOS_PLIST_BASE64 }}
      - run: ruby scripts/install-ios-widget.rb
      - run: rm Podfile.lock && pod install
        if: ${{ vars.TIMING_FIREBASE_CONFIG != '' }}
        working-directory: ios/App
      - name: Compile without signing
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Verify widget extension is embedded
        run: test -d build/ios/Build/Products/Release-iphoneos/App.app/PlugIns/TimingWidget.appex
      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app dist/Payload/Timing.app
          cd dist
          zip -qr Timing-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-iOS-unsigned-IPA
          path: dist/Timing-unsigned.ipa
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package:windows
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error

  linux:
    name: Ubuntu DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package:linux
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-Ubuntu-DEB
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish direct package downloads
    if: github.event_name != 'pull_request'
    needs: [android, ios, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Timing-*
          merge-multiple: true
          path: release-assets
      - name: Check every package exists
        shell: bash
        run: |
          for extension in apk ipa exe deb; do
            compgen -G "release-assets/*.${extension}" > /dev/null || exit 1
          done
      - name: Publish prerelease with individual files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" release-assets/*.apk release-assets/*.ipa release-assets/*.exe release-assets/*.deb \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Timing build ${GITHUB_RUN_NUMBER}" --prerelease \
            --notes "Android APK (release-signed when a release key is configured; otherwise debug), Windows portable EXE, Ubuntu DEB, and unsigned iOS IPA. Google sign-in requires Firebase configuration and matching signing credentials. The IPA requires Apple signing before device installation."
