name: Build installable packages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require stable Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing $name; refusing to publish an unstable debug APK."; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package:web
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
      - run: python3 scripts/configure-native.py prepare-android
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
          TIMING_FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.TIMING_FIREBASE_ANDROID_JSON_BASE64 }}
      - run: npx cap add android
      - run: python3 scripts/configure-native.py android
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
          TIMING_FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.TIMING_FIREBASE_ANDROID_JSON_BASE64 }}
      - run: python3 scripts/install-android-widget.py
      - name: Package signed Android APK
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd android && ./gradlew assembleRelease)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/timing.jks"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/timing.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out dist/Timing-android.apk "$RUNNER_TEMP/aligned.apk"
          rm "$RUNNER_TEMP/timing.jks"
          SIGNED=$("$BUILD_TOOLS/apksigner" verify --print-certs dist/Timing-android.apk | sed -n 's/.*certificate SHA-1 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          if [ -f android/app/google-services.json ]; then
            REGISTERED=$(node -e "console.log(require('./android/app/google-services.json').client[0].oauth_client.find(c => c.android_info).android_info.certificate_hash.toLowerCase())")
            echo "APK signed with SHA-1 $SIGNED (Firebase has $REGISTERED)"
            if [ "$SIGNED" != "$REGISTERED" ]; then echo "::error::The signing key does not match the SHA-1 registered in Firebase, so Google sign-in would fail."; exit 1; fi
          else
            echo 'APK release-signed; Google sync remains disabled until Firebase configuration is supplied.'
          fi
      - name: Verify widget is registered in APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump xmltree dist/Timing-android.apk AndroidManifest.xml | grep -q 'TimingWidgetProvider'
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-Android-APK
          path: dist/Timing-android.apk
          if-no-files-found: error

  ios:
    name: Signed iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require iOS signing credentials
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          for name in IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_APP_PROFILE_BASE64 IOS_WIDGET_PROFILE_BASE64 IOS_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing $name; a device-installable IPA cannot be built."; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run package:web
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
      - run: python3 scripts/configure-native.py prepare-ios
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
          TIMING_FIREBASE_IOS_PLIST_BASE64: ${{ secrets.TIMING_FIREBASE_IOS_PLIST_BASE64 }}
      - run: npx cap add ios
      - run: python3 scripts/configure-native.py ios
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
          TIMING_FIREBASE_IOS_PLIST_BASE64: ${{ secrets.TIMING_FIREBASE_IOS_PLIST_BASE64 }}
      - name: Install iOS signing certificate and profiles
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: bash scripts/install-ios-signing.sh
      - run: ruby scripts/install-ios-widget.rb
      - run: rm -f Podfile.lock && pod install
        working-directory: ios/App
      - name: Verify Google sign-in is bundled
        run: |
          test -f ios/App/App/GoogleService-Info.plist || test "$TIMING_FIREBASE_CONFIG" = '{}'
          grep -q FirebaseAuthentication ios/App/Podfile || test "$TIMING_FIREBASE_CONFIG" = '{}'
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
      - name: Archive signed app and widget
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/ios/Timing.xcarchive DEVELOPMENT_TEAM="$IOS_TEAM_ID" archive
      - name: Verify widget extension is embedded
        run: test -d build/ios/Timing.xcarchive/Products/Applications/App.app/PlugIns/TimingWidget.appex
      - name: Export device-installable IPA
        run: |
          python3 scripts/write-ios-export-options.py
          xcodebuild -exportArchive -archivePath build/ios/Timing.xcarchive -exportPath dist/ios -exportOptionsPlist "$RUNNER_TEMP/timing-export-options.plist"
          set -- dist/ios/*.ipa
          test "$#" -eq 1 && test -f "$1" || { echo '::error::Expected exactly one exported IPA.'; exit 1; }
          mv "$1" dist/Timing-ios.ipa
          mkdir -p "$RUNNER_TEMP/timing-ipa"
          unzip -q dist/Timing-ios.ipa -d "$RUNNER_TEMP/timing-ipa"
          test -f "$RUNNER_TEMP/timing-ipa/Payload/App.app/embedded.mobileprovision"
          test -f "$RUNNER_TEMP/timing-ipa/Payload/App.app/PlugIns/TimingWidget.appex/embedded.mobileprovision"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/timing-ipa/Payload/App.app"
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-iOS-signed-IPA
          path: dist/Timing-ios.ipa
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package:windows
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error

  linux:
    name: Ubuntu DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package:linux
        env:
          TIMING_FIREBASE_CONFIG: ${{ vars.TIMING_FIREBASE_CONFIG }}
      - uses: actions/upload-artifact@v4
        with:
          name: Timing-Ubuntu-DEB
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish direct package downloads
    if: github.event_name != 'pull_request'
    needs: [android, ios, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Timing-*
          merge-multiple: true
          path: release-assets
      - name: Check every package exists
        shell: bash
        run: |
          for extension in apk ipa exe deb; do
            compgen -G "release-assets/*.${extension}" > /dev/null || exit 1
          done
      - name: Publish prerelease with individual files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" release-assets/*.apk release-assets/*.ipa release-assets/*.exe release-assets/*.deb \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Timing build ${GITHUB_RUN_NUMBER}" --prerelease \
            --notes "Signed Android APK, signed iOS IPA for registered devices, Windows portable EXE, and Ubuntu DEB. Google sign-in still requires a live device check after installation."
